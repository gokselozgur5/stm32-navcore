[package]
name = "stm32-navcore"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Navigation core library for STM32."
repository = "https://github.com/gokselozgur5/stm32-navcore"
rust-version = "1.75"

[dependencies]
libm = { version = "0.2", default-features = false }

[lib]
crate-type = ["rlib"]

[lints.clippy]
needless_range_loop = "allow"
