[package]
name = "stm32-navcore"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Navigation core library for STM32."
repository = "https://github.com/gokselozgur5/stm32-navcore"
rust-version = "1.85"

[dependencies]
libm = { version = "0.2", default-features = false }

[features]
default = ["f64-geodesy", "sensors", "protocol"]
f64-geodesy = []
sensors = []
protocol = []

[lib]
crate-type = ["rlib"]

[lints.clippy]
needless_range_loop = "allow"

