name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt && rustup default 1.99.0
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy && rustup default 1.99.0
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - run: cargo test --all-targets
      - run: cargo test --no-default-features --all-targets

  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --target thumbv7em-none-eabihf && rustup default 1.99.0
      - run: cargo build --release --target thumbv7em-none-eabihf
      - run: cargo build --release --no-default-features --target thumbv7em-none-eabihf
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends qemu-system-arm binutils-arm-none-eabi
      - run: |
          cd embedded/qemu-m4f-smoke
          cargo build --release --target thumbv7em-none-eabihf
          arm-none-eabi-size target/thumbv7em-none-eabihf/release/qemu-m4f-smoke
          timeout 30s qemu-system-arm -cpu cortex-m4 -machine mps2-an386 -nographic -semihosting-config enable=on,target=native -kernel target/thumbv7em-none-eabihf/release/qemu-m4f-smoke

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check --all-targets
      - run: cargo check --no-default-features --all-targets
      - run: cargo check --target thumbv7em-none-eabihf
      - run: cargo check --no-default-features --target thumbv7em-none-eabihf
